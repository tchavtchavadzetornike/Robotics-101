[project]
name = "dora-robotics"
version = "0.1.0"
description = "dora-rs examples and small robot simulations, runnable on a laptop"
requires-python = ">=3.11,<3.14"
dependencies = [
    "dora-rs==1.1.0",
    "pyarrow>=17",
    "numpy>=2.0",
    "rerun-sdk>=0.24",
]

[project.optional-dependencies]
vision = [
    "opencv-python>=4.10",
    "ultralytics>=8.3",
]
sim = [
    "mujoco>=3.3",
    "onnxruntime>=1.20",
]
agent = [  # the language model that plans with the skills, tell-the-robot phase 5
    "anthropic>=0.70",
]
detect = [  # open-vocabulary detectors for tell-the-robot phase 3
    "ultralytics>=8.3",
    "transformers>=4.46",
    "torch>=2.5",
    "pillow>=10",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
